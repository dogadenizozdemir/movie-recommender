services:
  postgres:
    image: postgres:16
    container_name: movie_postgres
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: movie_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: movie_user
      MONGO_INITDB_ROOT_PASSWORD: movie_pass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: